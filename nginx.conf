# --- Limites por IP (protecao contra abuso / DoS simples) ---
limit_req_zone  $binary_remote_addr zone=api:10m        rate=10r/s;
limit_req_zone  $binary_remote_addr zone=orders:10m     rate=30r/m;
limit_req_zone  $binary_remote_addr zone=simulation:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# Protocolo original: vem do Caddy (HTTPS) ou e o proprio scheme quando acessado direto
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

upstream order_client {
  server order-client:8080;
  keepalive 16;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Corpo pequeno: um pedido valido tem poucos KB
  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  # IP real quando atras do Caddy/proxy da rede Docker (so confia em redes privadas)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  include /etc/nginx/snippets/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # Host com porta + protocolo original: o Spring reconhece as chamadas do front como mesma origem
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;

  # Eventos em tempo real (SSE): sem buffer, conexao longa, no maximo 4 abas por IP
  location = /api/events/stream {
    limit_conn perip 4;
    limit_except GET { deny all; }
    proxy_pass http://order_client;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/simulation/ {
    limit_req zone=simulation burst=10 nodelay;
    limit_except GET POST PUT { deny all; }
    proxy_pass http://order_client;
  }

  location /api/orders {
    limit_req zone=orders burst=10 nodelay;
    limit_except GET POST { deny all; }
    proxy_pass http://order_client;
  }

  location = /api/catalog {
    limit_req zone=api burst=20 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://order_client;
  }

  # Qualquer outra rota da API (ex.: /actuator nunca e exposto)
  location /api/ {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
